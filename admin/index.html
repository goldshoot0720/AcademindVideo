<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>課程後台 · Academind 雙語字幕庫</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --line:#e3e6ec; --line-soft:#eef0f4;
    --ink:#1a1d23; --ink-2:#5b6371; --ink-3:#8b93a1;
    --accent:#2f6fed; --accent-soft:#eaf1fe;
    --ok:#0f9d58; --ok-soft:#e7f6ee;
    --warn:#b26b00; --warn-soft:#fdf3e2;
    --bad:#c62828; --bad-soft:#fdecec;
    --radius:10px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
    padding:12px 20px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  header h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--ink-3);font-size:12.5px}
  header .spacer{flex:1}
  .tool-chip{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
    font-size:12px;background:var(--line-soft);color:var(--ink-2);
  }
  .tool-chip b{font-weight:600}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
  .dot.on{background:var(--ok)}
  .dot.off{background:var(--bad)}

  /* ---------- layout ---------- */
  .layout{
    display:grid;grid-template-columns:264px minmax(0,1fr) 340px;
    gap:16px;padding:16px 20px 40px;align-items:start;
  }
  @media (max-width:1180px){
    .layout{grid-template-columns:240px minmax(0,1fr)}
    .jobs-col{grid-column:1/-1}
  }
  @media (max-width:820px){
    .layout{grid-template-columns:minmax(0,1fr)}
    .side-col{order:-1}
  }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
  .card + .card{margin-top:14px}
  .card-h{
    display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);
  }
  .card-h h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.2px}
  .card-h .hint{color:var(--ink-3);font-size:12px}
  .card-b{padding:14px}

  /* ---------- course list ---------- */
  .side-col{position:sticky;top:62px}
  .course-list{max-height:calc(100vh - 120px);overflow:auto;padding:6px}
  .course-item{
    display:block;width:100%;text-align:left;border:1px solid transparent;background:none;
    border-radius:8px;padding:9px 10px;cursor:pointer;font:inherit;color:inherit;
  }
  .course-item:hover{background:var(--line-soft)}
  .course-item.active{background:var(--accent-soft);border-color:#cfe0fd}
  .course-item .name{font-weight:600;font-size:13px;line-height:1.35;display:block}
  .course-item .meta{color:var(--ink-3);font-size:11.5px;display:flex;justify-content:space-between;margin-top:3px}
  .bar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
  .bar > i{display:block;height:100%;background:var(--ok);width:0}

  /* ---------- course head ---------- */
  .title-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .title-row h2{margin:0;font-size:18px;font-weight:680;letter-spacing:.2px}
  .meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
  @media (max-width:640px){.meta-grid{grid-template-columns:1fr 1fr}}
  .meta-cell{background:#fbfcfd;border:1px solid var(--line-soft);border-radius:8px;padding:9px 11px}
  .meta-cell .k{font-size:11px;color:var(--ink-3);letter-spacing:.3px;text-transform:uppercase}
  .meta-cell .v{margin-top:2px;font-size:13px;font-weight:600;word-break:break-word}
  .meta-cell .v.mono{font-family:var(--mono);font-weight:500;font-size:12px}

  /* ---------- forms ---------- */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:720px){.grid-2{grid-template-columns:1fr}}
  label.field{display:block;margin-bottom:10px}
  label.field > span{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
  select,input[type=text],input[type=number]{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    background:#fff;font:inherit;color:var(--ink);
  }
  select:focus,input:focus{outline:2px solid var(--accent-soft);border-color:#b9cffb}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .check{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  button{
    font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:8px 14px;cursor:pointer;
  }
  button:hover:not(:disabled){border-color:#c8ced9}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:#2760d4}
  button.ghost{background:none}
  button:disabled{opacity:.5;cursor:not-allowed}
  .section-label{font-size:12px;font-weight:650;color:var(--ink-2);letter-spacing:.3px;margin:0 0 10px}

  /* ---------- table ---------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{
    position:sticky;top:0;background:#fbfcfd;text-align:left;font-weight:600;color:var(--ink-2);
    padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:7px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:hover{background:#fcfdff}
  td.num{color:var(--ink-3);font-family:var(--mono);font-size:11.5px}
  td.mono{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap}
  .table-wrap{max-height:460px;overflow:auto;border-radius:0 0 var(--radius) var(--radius)}
  .badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600}
  .badge.ok{background:var(--ok-soft);color:var(--ok)}
  .badge.miss{background:var(--warn-soft);color:var(--warn)}
  .sec-row td{background:#f8fafc;font-weight:650;color:var(--ink-2);font-size:11.5px;letter-spacing:.3px}

  /* ---------- jobs ---------- */
  .jobs-col{position:sticky;top:62px}
  .job{border:1px solid var(--line-soft);border-radius:9px;padding:10px 11px;margin-bottom:10px}
  .job:last-child{margin-bottom:0}
  .job-top{display:flex;align-items:center;gap:8px}
  .job-top .t{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st{font-size:11px;font-weight:650;padding:1px 7px;border-radius:999px;background:var(--line-soft);color:var(--ink-2);white-space:nowrap}
  .st.running{background:var(--accent-soft);color:var(--accent)}
  .st.done{background:var(--ok-soft);color:var(--ok)}
  .st.failed{background:var(--bad-soft);color:var(--bad)}
  .st.cancelled{background:var(--warn-soft);color:var(--warn)}
  .job .bar{margin-top:5px;height:6px}
  .job .bar > i{background:var(--accent);transition:width .3s}
  .job-detail{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;margin-top:7px;
    font:11.5px/1.45 var(--mono);color:var(--ink-2)}
  .job-detail span:first-child{font-weight:700;color:var(--ink);white-space:nowrap}
  .job-detail span:last-child{text-align:right;flex:1;min-width:0;word-break:break-all}
  .job pre{
    margin:8px 0 0;padding:8px;background:#0f1420;color:#c9d4e5;border-radius:7px;
    font:11px/1.5 var(--mono);max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  }
  .job details summary{cursor:pointer;font-size:11.5px;color:var(--ink-3);margin-top:7px;list-style:none}
  .job details summary::-webkit-details-marker{display:none}
  .job details summary::before{content:"▸ ";}
  .job details[open] summary::before{content:"▾ ";}
  .empty{color:var(--ink-3);font-size:12.5px;text-align:center;padding:18px 6px}

  /* ---------- log viewer ---------- */
  .logbtn{margin-top:8px;width:100%;padding:5px 8px;font-size:11.5px;font-weight:600;
    border-radius:7px;background:var(--line-soft);border:1px solid transparent;color:var(--ink-2)}
  .logbtn:hover{border-color:var(--line);color:var(--ink)}
  .modal{position:fixed;inset:0;background:rgba(16,20,28,.55);display:none;
    align-items:center;justify-content:center;padding:32px;z-index:80}
  .modal.show{display:flex}
  .modal-box{background:var(--panel);border-radius:12px;width:min(1100px,100%);
    height:min(78vh,760px);display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.28)}
  .modal-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .modal-h .t{font-size:13.5px;font-weight:650;flex:1;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .modal-h button{padding:5px 11px;font-size:12px}
  .modal-b{flex:1;min-height:0;background:#0f1420}
  .modal-b pre{margin:0;padding:14px 16px;height:100%;overflow:auto;
    font:12px/1.65 var(--mono);color:#cfd8e6;white-space:pre;tab-size:4}
  .modal-b pre::-webkit-scrollbar{width:10px;height:10px}
  .modal-b pre::-webkit-scrollbar-thumb{background:#2c3648;border-radius:5px}
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);
    background:#1a1d23;color:#fff;padding:9px 16px;border-radius:9px;font-size:12.5px;
    opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:80vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <h1>課程後台</h1>
  <span class="sub">影片來源下載 · 按單元分割</span>
  <span class="spacer"></span>
  <span class="tool-chip" id="toolFfmpeg"><span class="dot"></span>ffmpeg</span>
  <span class="tool-chip" id="toolYtdlp"><span class="dot"></span>yt-dlp</span>
  <a href="/" style="font-size:12.5px">← 課程首頁</a>
</header>

<div class="layout">

  <!-- 課程清單 -->
  <aside class="side-col">
    <div class="card">
      <div class="card-h">
        <h2>課程</h2>
        <span class="spacer" style="flex:1"></span>
        <button class="ghost" id="btnRefresh" title="重新掃描" style="padding:3px 9px;font-size:12px">重新掃描</button>
      </div>
      <div class="course-list" id="courseList"><div class="empty">載入中…</div></div>
    </div>
  </aside>

  <!-- 主區 -->
  <main>
    <section class="card" id="headCard">
      <div class="card-b">
        <div class="title-row">
          <h2 id="courseTitle">請選擇一門課程</h2>
        </div>
        <div class="meta-grid" id="courseMeta"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h2>來源下載</h2><span class="hint">用 yt-dlp 取得原始影片</span></div>
      <div class="card-b">
        <div class="grid-2">
          <div>
            <label class="field"><span>下載來源</span>
              <select id="dlMode">
                <option value="bilibili">Bilibili 鏡像（整門課，全部分 P）</option>
                <option value="lecture">原始課程頁（單一單元）</option>
                <option value="custom">自訂網址</option>
              </select>
            </label>
            <label class="field" id="lectureWrap" style="display:none"><span>選擇單元</span>
              <select id="dlLecture"></select>
            </label>
            <label class="field" id="customWrap" style="display:none"><span>影片網址</span>
              <input type="text" id="dlUrl" placeholder="https://www.bilibili.com/video/BV...">
            </label>
          </div>
          <div>
            <label class="field"><span>登入憑證（Bilibili 需要，否則會被風控 412）</span>
              <select id="dlBrowser">
                <option value="firefox">讀取 Firefox cookies（此機可用）</option>
                <option value="">不使用瀏覽器 cookies</option>
                <option value="chrome">讀取 Chrome cookies</option>
                <option value="edge">讀取 Edge cookies</option>
              </select>
            </label>
            <label class="field"><span>並行連線（分 P 同時下載，可明顯加速）</span>
              <select id="dlParallel">
                <option value="3" selected>3 條（建議）</option>
                <option value="1">1 條（最慢，最穩）</option>
                <option value="2">2 條</option>
                <option value="4">4 條</option>
                <option value="6">6 條（最快，容易被限流）</option>
              </select>
            </label>
            <label class="field"><span>或 cookies.txt 路徑（選填）</span>
              <input type="text" id="dlCookies" placeholder="例如 C:\Users\me\cookies.txt">
            </label>
            <div class="row">
              <button class="primary" id="btnDownload">開始下載</button>
              <button id="btnProbe">測試來源</button>
              <span class="hint" id="dlHint" style="color:var(--ink-3);font-size:12px"></span>
            </div>
          </div>
        </div>
        <div id="probeOut" style="margin-top:12px;display:none"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h2>分割影片</h2><span class="hint">依 lessons.json 時長切成 player 需要的檔案</span></div>
      <div class="card-b">
        <div class="grid-2">
          <div>
            <label class="field"><span>來源影片</span>
              <select id="spSource"></select>
            </label>
            <label class="field"><span>分割方式</span>
              <select id="spMode">
                <option value="lessons">按單元時長（輸出 video/&lt;單元&gt;.mp4）</option>
                <option value="fixed">固定長度（輸出 video/part_NNN.mp4）</option>
              </select>
            </label>
          </div>
          <div>
            <label class="field" id="secWrap" style="display:none"><span>每段秒數</span>
              <input type="number" id="spSeconds" value="600" min="5" step="5">
            </label>
            <div class="row" style="margin-bottom:12px">
              <label class="check"><input type="checkbox" id="spAccurate"> 精準切割（重新編碼，較慢）</label>
              <label class="check"><input type="checkbox" id="spOverwrite"> 覆寫既有檔案</label>
            </div>
            <div class="row">
              <button class="primary" id="btnSplit">開始分割</button>
              <span class="hint" id="spHint" style="color:var(--ink-3);font-size:12px"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="card-h">
        <h2>單元與檔案狀態</h2>
        <span class="spacer" style="flex:1"></span>
        <span class="hint" id="lessonSummary"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:44px">#</th><th>單元</th><th style="width:70px">時長</th>
            <th style="width:150px">時間範圍</th><th style="width:96px">本機檔案</th>
          </tr></thead>
          <tbody id="lessonBody"><tr><td colspan="5" class="empty">—</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- 任務 -->
  <aside class="jobs-col">
    <div class="card">
      <div class="card-h">
        <h2>任務</h2>
        <span class="spacer" style="flex:1"></span>
        <button class="ghost" id="btnClearJobs" style="padding:3px 9px;font-size:12px">清除已完成</button>
      </div>
      <div class="card-b" id="jobList"><div class="empty">目前沒有任務</div></div>
    </div>
  </aside>
</div>

<div class="modal" id="logModal">
  <div class="modal-box">
    <div class="modal-h">
      <span class="t" id="logTitle">日誌</span>
      <span class="st" id="logStatus">—</span>
      <button id="btnCopyLog">複製</button>
      <button id="btnCloseLog">關閉</button>
    </div>
    <div class="modal-b"><pre id="logPre"></pre></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const state = { slug: null, course: null, sources: [], tools: {}, jobStatus: {}, jobsById: {} };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
}
function fmtSize(b) {
  if (!b) return "0 B";
  const u = ["B", "KB", "MB", "GB"];
  let i = 0, n = b;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}
let toastTimer = null;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
function post(path, body) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}),
  });
}

/* ---------------------------------------------------------- 課程清單 */
async function loadState() {
  const data = await api("/admin/api/state");
  state.tools = data.tools || {};
  const ok = (id, on, label) => {
    const el = $(id);
    el.querySelector(".dot").className = "dot " + (on ? "on" : "off");
    el.querySelector("b")?.remove();
    el.insertAdjacentHTML("beforeend", " <b>" + (on ? "就緒" : "缺少") + "</b>");
  };
  ok("toolFfmpeg", !!state.tools.ffmpeg);
  ok("toolYtdlp", !!state.tools.ytdlp);

  const list = data.courses || [];
  $("courseList").innerHTML = list.length
    ? list.map((c) => {
        const pct = c.lessonCount ? Math.round((c.done / c.lessonCount) * 100) : 0;
        return `<button class="course-item${c.slug === state.slug ? " active" : ""}" data-slug="${esc(c.slug)}">
          <span class="name">${esc(c.series)}</span>
          <span class="meta"><span>${c.done}/${c.lessonCount} 單元</span><span>${esc(c.bv || "—")}</span></span>
          <span class="bar"><i style="width:${pct}%"></i></span>
        </button>`;
      }).join("")
    : `<div class="empty">courses/ 目錄下沒有課程</div>`;

  $("courseList").querySelectorAll(".course-item").forEach((btn) => {
    btn.onclick = () => selectCourse(btn.dataset.slug);
  });

  if (!state.slug && list.length) {
    const wanted = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    const hit = list.find((c) => c.slug === wanted);
    selectCourse(hit ? hit.slug : list[0].slug);
  }
}

/* ---------------------------------------------------------- 單一課程 */
async function selectCourse(slug) {
  state.slug = slug;
  if (location.hash.slice(1) !== slug) history.replaceState(null, "", "#" + slug);
  $("courseList").querySelectorAll(".course-item").forEach((b) =>
    b.classList.toggle("active", b.dataset.slug === slug));

  const [course, sources] = await Promise.all([
    api("/admin/api/course?slug=" + encodeURIComponent(slug)),
    api("/admin/api/sources?slug=" + encodeURIComponent(slug)),
  ]);
  state.course = course;
  state.sources = sources.files || [];
  renderHead(course);
  renderDownloadForm(course);
  renderSplitForm(course);
  renderLessons(course);
}

function renderHead(c) {
  $("courseTitle").textContent = c.series;
  const link = c.seriesUrl ? `<a href="${esc(c.seriesUrl)}" target="_blank" rel="noreferrer">課程頁 ↗</a>` : "—";
  const mirrorVal = c.mirrorUrl || c.bv || "";
  const src = c.downloadUrl
    ? `<a href="${esc(c.downloadUrl)}" target="_blank" rel="noreferrer">${esc(c.downloadUrl)} ↗</a>`
    : `<span style="color:var(--warn)">尚未設定，請填入 BV 號或影片網址</span>`;
  const pct = c.lessonCount ? Math.round((c.done / c.lessonCount) * 100) : 0;
  $("courseMeta").innerHTML = `
    <div class="meta-cell"><div class="k">講師</div><div class="v">${esc(c.instructor || "—")}</div></div>
    <div class="meta-cell"><div class="k">平台</div><div class="v">${esc(c.platform || "—")}</div></div>
    <div class="meta-cell"><div class="k">來源</div><div class="v">${link}</div></div>
    <div class="meta-cell" style="grid-column:span 2">
      <div class="k">鏡像來源（可手動修改，會寫回 course.json）</div>
      <div class="row" style="gap:6px;margin-top:5px">
        <input type="text" id="mirrorInput" value="${esc(mirrorVal)}" placeholder="BV1xxxxxxxxx 或 https://…" style="flex:1">
        <button id="btnSaveMirror" style="padding:7px 12px;font-size:12px;white-space:nowrap">儲存</button>
      </div>
      <div class="v mono" style="margin-top:6px;font-size:11.5px;color:var(--ink-3);font-weight:400">${src}</div>
    </div>
    <div class="meta-cell"><div class="k">單元 / 總長 / 已下載</div>
      <div class="v">${c.lessonCount} · ${fmtDur(c.totalSeconds)} · ${c.done}/${c.lessonCount}（${pct}%）</div></div>`;

  const btn = $("btnSaveMirror");
  if (btn) btn.onclick = saveMirror;
}

async function saveMirror() {
  const btn = $("btnSaveMirror");
  btn.disabled = true;
  try {
    await post("/admin/api/course/mirror", { slug: state.slug, value: $("mirrorInput").value });
    toast("鏡像來源已更新");
    await selectCourse(state.slug);
    await loadState();
  } catch (e) {
    toast("儲存失敗：" + e.message);
  } finally {
    btn.disabled = false;
  }
}

function renderDownloadForm(c) {
  const sel = $("dlLecture");
  sel.innerHTML = (c.lessons || []).map((l) =>
    `<option value="${esc(l.lectureId || "")}">${String(l.index).padStart(2, "0")} ${esc(l.title)}</option>`).join("");
  $("dlHint").textContent = c.bilibiliUrl ? "" : "此課程沒有 bilibili 鏡像，可改用原始課程頁或自訂網址";
}

function renderSplitForm(c) {
  const lessonSlugs = new Set((c.lessons || []).map((l) => l.slug + ".mp4"));
  const candidates = state.sources.filter((f) => !(lessonSlugs.has(f.path) && !f.path.includes("/")));
  const sel = $("spSource");
  if (!candidates.length) {
    sel.innerHTML = `<option value="">（沒有可用的來源影片）</option>`;
    $("spHint").textContent = "請先下載，或手動放到 courses/" + c.slug + "/video/_source/";
  } else {
    sel.innerHTML = candidates.map((f) =>
      `<option value="${esc(f.path)}">${esc(f.path)} · ${fmtSize(f.size)}${f.duration ? " · " + fmtDur(f.duration) : ""}</option>`).join("");
    $("spHint").textContent = "";
  }
  $("btnSplit").disabled = !candidates.length || !state.tools.ffmpeg;
}

function renderLessons(c) {
  const body = $("lessonBody");
  if (!c.lessons || !c.lessons.length) {
    body.innerHTML = `<tr><td colspan="5" class="empty">這門課沒有 lessons.json</td></tr>`;
    $("lessonSummary").textContent = "";
    return;
  }
  let html = "", lastSection = null;
  for (const l of c.lessons) {
    if (l.sectionTitle && l.sectionTitle !== lastSection) {
      lastSection = l.sectionTitle;
      html += `<tr class="sec-row"><td colspan="5">${esc(l.section ? "§" + l.section + " · " : "")}${esc(l.sectionTitle)}</td></tr>`;
    }
    const badge = l.video.exists
      ? `<span class="badge ok">${fmtSize(l.video.size)}</span>`
      : `<span class="badge miss">缺檔</span>`;
    html += `<tr>
      <td class="num">${String(l.index).padStart(2, "0")}</td>
      <td>${esc(l.title)}</td>
      <td class="mono">${esc(l.duration || "—")}</td>
      <td class="mono">${fmtDur(l.start)} → ${fmtDur(l.end)}</td>
      <td>${badge}</td>
    </tr>`;
  }
  body.innerHTML = html;
  $("lessonSummary").textContent = `${c.done}/${c.lessonCount} 已完成`;
}

/* ---------------------------------------------------------- 動作 */
$("dlMode").onchange = () => {
  const mode = $("dlMode").value;
  $("lectureWrap").style.display = mode === "lecture" ? "" : "none";
  $("customWrap").style.display = mode === "custom" ? "" : "none";
};
$("spMode").onchange = () => {
  $("secWrap").style.display = $("spMode").value === "fixed" ? "" : "none";
};

function downloadPayload() {
  return {
    slug: state.slug,
    mode: $("dlMode").value,
    lectureId: $("dlLecture").value,
    url: $("dlUrl").value,
    cookies: $("dlCookies").value,
    cookiesFromBrowser: $("dlBrowser").value,
    parallel: Number($("dlParallel").value) || 3,
  };
}

$("btnProbe").onclick = async () => {
  if (!state.slug) return;
  const btn = $("btnProbe");
  const out = $("probeOut");
  btn.disabled = true;
  out.style.display = "";
  out.innerHTML = `<span class="hint" style="color:var(--ink-3);font-size:12px">探測中…（最長 90 秒）</span>`;
  try {
    const r = await post("/admin/api/probe", downloadPayload());
    if (r.ok) {
      const rows = (r.items || []).map((it) =>
        `<tr><td class="num">${esc(it.index)}</td><td>${esc(it.title)}</td><td class="mono">${esc(it.duration)}</td></tr>`).join("");
      out.innerHTML = `<div style="border:1px solid var(--line-soft);border-radius:8px;overflow:hidden">
        <div style="padding:8px 11px;background:var(--ok-soft);color:var(--ok);font-size:12.5px;font-weight:600">
          來源可用 · 共 ${r.count} 個影片${r.count > 12 ? "（僅列前 12）" : ""}
        </div>
        <div class="table-wrap" style="max-height:220px"><table><tbody>${rows}</tbody></table></div>
      </div>`;
    } else {
      const hints = (r.hints || []).map((h) => `<li>${esc(h)}</li>`).join("");
      out.innerHTML = `<div style="border:1px solid #f3d4d4;border-radius:8px;padding:10px 12px;background:var(--bad-soft)">
        <div style="color:var(--bad);font-size:12.5px;font-weight:600">來源不可用</div>
        <div style="font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-top:4px;word-break:break-all">${esc(r.error || "")}</div>
        ${hints ? `<ul style="margin:8px 0 0 18px;padding:0;font-size:12px;color:var(--ink-2);line-height:1.7">${hints}</ul>` : ""}
      </div>`;
    }
  } catch (e) {
    out.innerHTML = `<span style="color:var(--bad);font-size:12.5px">探測失敗：${esc(e.message)}</span>`;
  } finally { btn.disabled = false; }
};

$("btnDownload").onclick = async () => {
  if (!state.slug) return;
  const btn = $("btnDownload");
  btn.disabled = true;
  try {
    await post("/admin/api/download", downloadPayload());
    toast("已加入下載任務");
    pollJobs();
  } catch (e) { toast("下載失敗：" + e.message); }
  finally { btn.disabled = false; }
};

$("btnSplit").onclick = async () => {
  if (!state.slug) return;
  const btn = $("btnSplit");
  btn.disabled = true;
  try {
    await post("/admin/api/split", {
      slug: state.slug,
      source: $("spSource").value,
      mode: $("spMode").value,
      seconds: Number($("spSeconds").value) || 600,
      accurate: $("spAccurate").checked,
      overwrite: $("spOverwrite").checked,
    });
    toast("已加入分割任務");
    pollJobs();
  } catch (e) { toast("分割失敗：" + e.message); }
  finally { btn.disabled = false; }
};

$("btnRefresh").onclick = async () => {
  await loadState();
  if (state.slug) await selectCourse(state.slug);
  toast("已重新掃描");
};

$("btnClearJobs").onclick = async () => {
  await post("/admin/api/jobs/clear", {});
  pollJobs();
};

/* ---------------------------------------------------------- 任務面板 */
let lastJobSig = "";

function renderJobList(jobs) {
  const box = $("jobList");
  if (!jobs.length) {
    box.innerHTML = `<div class="empty">目前沒有任務</div>`;
    return;
  }
  box.innerHTML = jobs.map((j) => {
    const pct = Math.round((j.progress || 0) * 100);
    const canCancel = j.status === "running" || j.status === "queued";
    return `<div class="job" id="job-${esc(j.id)}">
      <div class="job-top">
        <span class="t" title="${esc(j.title)}">${esc(j.title)}</span>
        <span class="st ${esc(j.status)}">${STATUS_LABEL[j.status] || esc(j.status)}</span>
        <button class="ghost" data-cancel="${esc(j.id)}" style="padding:1px 7px;font-size:11px;${canCancel ? "" : "display:none"}">取消</button>
      </div>
      <div class="job-detail"><span>${pct}%</span><span>${esc(j.detail || "")}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <button class="logbtn" data-log="${esc(j.id)}">查看日誌（${(j.log || []).length} 行）</button>
    </div>`;
  }).join("");
}

function updateJobList(jobs) {
  for (const j of jobs) {
    const root = document.getElementById("job-" + j.id);
    if (!root) continue;
    const pct = Math.round((j.progress || 0) * 100);
    const st = root.querySelector(".st");
    if (st) {
      st.textContent = STATUS_LABEL[j.status] || j.status;
      st.className = "st " + j.status;
    }
    const d1 = root.querySelector(".job-detail span:first-child");
    const d2 = root.querySelector(".job-detail span:last-child");
    if (d1) d1.textContent = pct + "%";
    if (d2) d2.textContent = j.detail || "";
    const bar = root.querySelector(".bar > i");
    if (bar) bar.style.width = pct + "%";
    const lb = root.querySelector("[data-log]");
    if (lb) lb.textContent = "查看日誌（" + (j.log || []).length + " 行）";
    const cb = root.querySelector("[data-cancel]");
    if (cb) cb.style.display = (j.status === "running" || j.status === "queued") ? "" : "none";
  }
}

// Delegated once on the container: survives every re-render, so a click can
// never be swallowed by the 1.5s polling refresh.
$("jobList").addEventListener("click", async (e) => {
  const logBtn = e.target.closest("[data-log]");
  if (logBtn) { openLog(logBtn.dataset.log); return; }
  const cancelBtn = e.target.closest("[data-cancel]");
  if (cancelBtn) {
    try {
      await post("/admin/api/jobs/cancel", { id: cancelBtn.dataset.cancel });
    } catch (err) {
      toast(err.message);
    }
    pollJobs();
  }
});

let refreshQueued = false;
async function pollJobs() {
  let data;
  try { data = await api("/admin/api/jobs"); } catch (e) { return; }
  const jobs = data.jobs || [];

  let finishedNow = false;
  for (const j of jobs) {
    const prev = state.jobStatus[j.id];
    if (prev && prev !== j.status && (j.status === "done" || j.status === "failed")) finishedNow = true;
    state.jobStatus[j.id] = j.status;
  }

  // Only rebuild the list when the SET of jobs changes. Re-rendering every
  // poll would replace the buttons mid-click and swallow the click event.
  const sig = jobs.map((j) => j.id).join(",");
  if (sig !== lastJobSig) {
    renderJobList(jobs);
    lastJobSig = sig;
  } else {
    updateJobList(jobs);
  }

  state.jobsById = {};
  jobs.forEach((j) => { state.jobsById[j.id] = j; });
  if (logJobId) renderLog();

  if (finishedNow && !refreshQueued) {
    refreshQueued = true;
    setTimeout(async () => {
      refreshQueued = false;
      if (state.slug) {
        await selectCourse(state.slug);
        await loadState();
      }
    }, 600);
  }
}

/* ---------------------------------------------------------- 日誌檢視器 */
const STATUS_LABEL = { queued: "排隊中", running: "執行中", done: "完成", failed: "失敗", cancelled: "已取消" };
let logJobId = null;

function openLog(id) {
  logJobId = id;
  $("logModal").classList.add("show");
  renderLog();
  const pre = $("logPre");
  pre.scrollTop = pre.scrollHeight;
}

function closeLog() {
  logJobId = null;
  $("logModal").classList.remove("show");
}

function renderLog() {
  const j = state.jobsById[logJobId];
  if (!j) { closeLog(); return; }

  $("logTitle").textContent = j.title;
  const st = $("logStatus");
  st.textContent = STATUS_LABEL[j.status] || j.status;
  st.className = "st " + j.status;

  const lines = j.log || [];
  $("btnCopyLog").textContent = "複製（" + lines.length + " 行）";

  const pre = $("logPre");
  const pinned = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 40;
  const text = lines.join("\n");
  if (pre.textContent !== text) {
    pre.textContent = text;
    if (pinned) pre.scrollTop = pre.scrollHeight;
  }
}

$("btnCloseLog").onclick = closeLog;
$("logModal").addEventListener("click", (e) => { if (e.target.id === "logModal") closeLog(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && logJobId) closeLog(); });
$("btnCopyLog").onclick = async () => {
  const j = state.jobsById[logJobId];
  if (!j) return;
  const text = (j.log || []).join("\n");
  try {
    await navigator.clipboard.writeText(text);
    toast("日誌已複製");
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("日誌已複製");
  }
};

/* ---------------------------------------------------------- 啟動 */
(async () => {
  try {
    await loadState();
  } catch (e) {
    toast("載入失敗：" + e.message);
  }
  pollJobs();
  setInterval(pollJobs, 1500);
})();
</script>
